<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The constellation-M logo is the icon. `sizes="any"` is the hint that tells
         browsers to prefer this scalable version over any raster fallback.
         favicon.ico is deliberately NOT declared here: browsers that cannot
         render an SVG icon request /favicon.ico on their own, and that file is
         still sitting in /public as their fallback. -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/profile.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e27" />

    <title>Medhat Ashour — Software Engineer | React, TypeScript &amp; Node.js</title>
    <meta
      name="description"
      content="Medhat Ashour — Software Engineer with 4 years building web, desktop and cross-platform applications. React, TypeScript, Node.js, Python, Qt and CI/CD. Open to remote and relocation (UAE / KSA)."
    />
    <meta name="author" content="Medhat Ashour" />
    <meta
      name="keywords"
      content="Medhat Ashour, Software Engineer, React Developer, TypeScript, Node.js, Next.js, Python, PyQt, PySide, System Design, OOP, CI/CD, Remote Software Engineer"
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Medhat Ashour — Software Engineer | React, TypeScript &amp; Node.js" />
    <meta
      property="og:description"
      content="Software Engineer with 4 years building web, desktop and cross-platform applications. React, TypeScript, Node.js, Python, Qt and CI/CD. Open to remote and relocation (UAE / KSA)."
    />
    <meta property="og:image" content="/profile.png" />
    <meta property="og:site_name" content="Medhat Ashour" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Medhat Ashour — Software Engineer | React, TypeScript &amp; Node.js" />
    <meta
      name="twitter:description"
      content="Software Engineer with 4 years building web, desktop and cross-platform applications. React, TypeScript, Node.js, Python, Qt and CI/CD."
    />
    <meta name="twitter:image" content="/profile.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>

  </body>
</html>
