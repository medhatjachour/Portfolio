server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Favicons sit at a fixed URL and change whenever the logo is tweaked, so they
  # must not inherit the year-long `immutable` rule below — that would pin a
  # stale icon in every browser that had already seen it. nginx evaluates regex
  # locations in order, so this block has to come first.
  location ~* /favicon\.(svg|ico)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}